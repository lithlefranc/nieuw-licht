# Omgeving waarin de notebooks gedraaid zijn (november 2026).
# Aanmaken:  conda env create -f environment.yml
# Gebruiken: conda activate incidentbooks
#
# Dit bestand dekt ook de NER-nabewerking (scripts/H4/4.1_ner_nabewerking).
name: incidentbooks
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # basis
      - numpy==1.26.4
      - pandas==2.2.3
      - scipy==1.14.1
      - openpyxl==3.1.5
      - pyarrow==24.0.0
      - tqdm==4.67.0
      - lxml==4.9.4
      - requests==2.28.2
      # figuren
      - matplotlib==3.9.2
      - seaborn==0.13.2
      - plotly==6.6.0
      - kaleido==1.4.0
      - adjustText==1.4.0
      - matplotlib-scalebar==0.9.0
      # kaarten
      - geopandas==1.1.3
      - shapely==2.1.2
      # statistiek en Bayesiaanse modellen
      - scikit-learn==1.6.1
      - pymc==5.19.1
      - pytensor==2.26.4
      - arviz==0.20.0
      - bambi==0.14.0
      # tekst en woordvectoren
      - gensim==4.4.0
      - umap-learn==0.5.11
      - hdbscan==0.8.42
      - nltk==3.9.4
      - langid==1.1.6
      - fuzzywuzzy==0.18.0
      - Levenshtein==0.26.1
      - RapidFuzz==3.12.1
      # astronomische tijd (zonsopgang en -ondergang)
      - ephem==4.2
      # taalmodel (alleen voor het ophalen van annotaties)
      - anthropic==0.94.0
      # NER-nabewerking (scripts/H4/4.1_ner_nabewerking)
      # exacte versies niet bijgehouden; dit zijn minimumversies
      - torch>=2.0
      - transformers>=4.30
      - ftfy>=6.1
      # notebooks
      - ipykernel==6.29.5
      - nbconvert==7.16.4
